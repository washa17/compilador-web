<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compilador ESP32-C3</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;max-width:460px;margin:30px auto;padding:0 16px}
input,button{width:100%;margin-top:12px;padding:14px;border-radius:8px;border:0;font-size:16px;box-sizing:border-box}
input{background:#222;color:#eee} button{background:#2d7ff9;color:#fff} button:disabled{background:#555}
details{margin-top:14px;background:#1a1a1a;padding:10px;border-radius:8px}
#msg{margin-top:16px;white-space:pre-wrap;font-family:monospace;font-size:13px;color:#ccc}
</style></head><body>
<h2>Compilador ESP32-C3</h2>
<p>Envie o .ino e baixe o .ino.bin para OTA.</p>

<details id="cfgBox"><summary>Configuração</summary>
<input id="repo" placeholder="usuario/compilador-esp">
<input id="token" type="password" placeholder="Token do GitHub">
<button id="salvar" type="button">Salvar</button></details>

<input type="file" id="file" accept=".ino">
<button id="btn">Compilar</button>
<div id="msg"></div>

<script>
const $ = id => document.getElementById(id);
const msg = $('msg');
const log = t => msg.textContent = t;
const sleep = ms => new Promise(r => setTimeout(r, ms));

try {
  const c = JSON.parse(localStorage.getItem('cfg') || '{}');
  $('repo').value = c.repo || ''; $('token').value = c.token || '';
  if (!c.repo || !c.token) $('cfgBox').open = true;
} catch (e) {}

$('salvar').onclick = () => {
  try { localStorage.setItem('cfg', JSON.stringify({repo: $('repo').value.trim(), token: $('token').value.trim()})); } catch (e) {}
  log('Configuração salva.'); $('cfgBox').open = false;
};

const api = (path, opt = {}) => fetch('https://api.github.com/repos/' + $('repo').value.trim() + path, {
  ...opt, cache: 'no-store',
  headers: {Authorization: 'Bearer ' + $('token').value.trim(), Accept: 'application/vnd.github+json', ...(opt.headers || {})}
});
const RAW = {Accept: 'application/vnd.github.raw+json'};

$('btn').onclick = async () => {
  const file = $('file').files[0];
  if (!file) return log('Escolha um arquivo .ino');
  if (!$('repo').value || !$('token').value) { $('cfgBox').open = true; return log('Preencha a configuração.'); }

  const nome = file.name.replace(/\.ino$/i, '').replace(/[^A-Za-z0-9_-]/g, '_');
  $('btn').disabled = true;
  try {
    log('Enviando para o GitHub...');
    const txt = (await file.text()) + `\n// build ${Date.now()}\n`;
    let bin = ''; new TextEncoder().encode(txt).forEach(b => bin += String.fromCharCode(b));
    const path = `/contents/sketches/${nome}/${nome}.ino`;

    let sha;
    const ex = await api(path);
    if (ex.ok) sha = (await ex.json()).sha;

    const put = await api(path, {method: 'PUT', body: JSON.stringify({message: 'compilar ' + nome, content: btoa(bin), sha})});
    if (!put.ok) throw new Error('Envio falhou: ' + (await put.text()));
    const commit = (await put.json()).commit.sha;

    let run = null;
    for (let i = 0; i < 180; i++) {
      await sleep(5000);
      const r = await api('/actions/runs?head_sha=' + commit);
      const j = await r.json();
      run = j.workflow_runs && j.workflow_runs[0];
      log(run ? `Compilando... (${run.status}) ${i * 5}s` : `Aguardando o GitHub iniciar... ${i * 5}s`);
      if (run && run.status === 'completed') break;
    }
    if (!run || run.status !== 'completed') throw new Error('Tempo esgotado.');

    if (run.conclusion === 'success') {
      const b = await api(`/contents/bin/${nome}.ino.bin`, {headers: RAW});
      if (b.ok) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(await b.blob());
        a.download = nome + '.ino.bin'; a.click();
        $('btn').disabled = false;
        return log('Pronto! Download: ' + nome + '.ino.bin');
      }
    }
    const l = await api(`/contents/bin/${nome}.log.txt`, {headers: RAW});
    log('Erro na compilação:\n' + (l.ok ? (await l.text()).slice(-3500) : 'Sem log. Veja a aba Actions do repositório.'));
  } catch (e) {
    log(String(e.message || e));
  }
  $('btn').disabled = false;
};
</script></body></html>
